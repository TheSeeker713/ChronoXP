[package]
name = "chronoxp"
version = "0.1.0"
description = "ChronoXP — Private encrypted journal"
authors = ["Jeremy Robards"]
license = "TBD"
repository = "https://github.com/TheSeeker713/chronoxp"
edition = "2021"
rust-version = "1.77"

[lib]
name = "chronoxp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Crypto
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
base32 = "0.4"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }

# Keychain — platform-native secret storage
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
once_cell = "1"

# Export/Import (ZIP)
zip = { version = "2", features = ["deflate"] }

# Encoding
base64 = "0.22"
hex = "0.4"

# Async trait support
async-trait = "0.1"

# chrono with full feature set
[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
