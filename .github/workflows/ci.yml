name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend (Node) tests ─────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run lint

      - name: Run Vitest
        run: npm test

  # ── Rust tests ────────────────────────────────────────────────────────────
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib --features "default" 2>&1
        env:
          RUST_BACKTRACE: 1

  # ── Build: Windows ────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [frontend-tests, rust-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build Tauri app
        run: npm run tauri build -- --bundles none
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: chronoxp-windows
          path: src-tauri/target/release/chronoxp.exe
          if-no-files-found: ignore

  # ── Build: macOS ──────────────────────────────────────────────────────────
  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: [frontend-tests, rust-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build Tauri app
        run: npm run tauri build -- --bundles none
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: chronoxp-macos
          path: src-tauri/target/release/chronoxp
          if-no-files-found: ignore

  # ── Build: Linux ──────────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: [frontend-tests, rust-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build Tauri app
        run: npm run tauri build -- --bundles deb

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: chronoxp-linux
          path: |
            src-tauri/target/release/chronoxp
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore
